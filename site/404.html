<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repoville · City not built yet</title>
<link rel="icon" href="/repoville/brand/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3EC;--surface:#FFFDF8;--text:#20231F;--muted:#596057;--rule:#D7D9CF;--accent:#356449;--accent-ink:#FFFDF8}
@media (prefers-color-scheme:dark){:root{--bg:#101410;--surface:#1B211B;--text:#F2F1E9;--muted:#B6BDAF;--rule:#394339;--accent:#9CC8A5;--accent-ink:#101410}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:17px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
main{max-width:680px;width:100%}
.logo{display:flex;align-items:center;gap:10px;font:800 21px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;color:var(--text);text-decoration:none;margin-bottom:48px}
.logo img{width:22px;height:22px}
h1{font:800 clamp(34px,6vw,56px)/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.04em;margin:0 0 18px}
p{color:var(--muted);margin:0 0 22px}
code,pre{font-family:'JetBrains Mono',monospace}
pre{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;overflow:auto;font-size:14px;line-height:1.7;margin:0 0 26px;white-space:pre-wrap;overflow-wrap:anywhere}
.btns{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
a.btn{display:inline-flex;align-items:center;min-height:46px;padding:0 22px;border-radius:999px;font-weight:600;text-decoration:none}
a.primary{background:var(--accent);color:var(--accent-ink)}
a.ghost{color:var(--text);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px;padding:0}
.repo{font-family:'JetBrains Mono',monospace;font-weight:600}
</style>
</head>
<body>
<main>
  <a class="logo" href="/repoville/"><img src="/repoville/brand/favicon.svg" alt="">repoville</a>
  <h1 id="title">This page is still under construction.</h1>
  <p id="lede">Nothing here yet.</p>
  <pre id="cmd" hidden></pre>
  <div class="btns">
    <a class="btn primary" id="req" href="https://github.com/maximilianfeix/repoville/issues/new?template=repo-request.yml" hidden>Request this city</a>
    <a class="btn ghost" href="/repoville/r/facebook/react/">Open the React demo</a>
  </div>
</main>
<script>
  // /repoville/r/<owner>/<repo>[/] → explain how to build that city.
  const m = location.pathname.match(/\/r\/([\w.-]+)\/([\w.-]+)\/?$/);
  if (m) {
    const slug = `${m[1]}/${m[2]}`;
    document.title = `${slug} · Repoville`;
    const t = document.getElementById('title');
    t.textContent = '';
    t.append('The city of ', Object.assign(document.createElement('span'), { className: 'repo', textContent: slug }), ' is not in the gallery yet.');
    document.getElementById('lede').textContent = 'Build it yourself. It runs on your machine and opens in your browser:';
    const cmd = document.getElementById('cmd');
    cmd.hidden = false;
    cmd.textContent = `npx --package=https://github.com/maximilianfeix/repoville/releases/latest/download/repoville.tgz repoville ${slug} --open`;
    const req = document.getElementById('req');
    req.hidden = false;
    req.href += `&title=${encodeURIComponent('Render ' + slug)}&repo=${encodeURIComponent(slug)}`;
  }
</script>
</body>
</html>
