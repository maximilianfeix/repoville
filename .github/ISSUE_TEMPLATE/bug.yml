name: Bug report
description: Something renders wrong, crashes or exports a broken file
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Include the command you ran and the output. }
    validations: { required: true }
  - type: input
    id: repo
    attributes: { label: Which repo or folder?, placeholder: "facebook/react, or a description of a private repo" }
  - type: input
    id: env
    attributes: { label: Environment, placeholder: "OS, Node version, browser / Minecraft version" }
